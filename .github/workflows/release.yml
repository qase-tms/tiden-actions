name: Release

# The only path that creates or moves tags in this repository.
#
# On a v*.*.* tag push: publish a GitHub release for it. Tags matching v*
# can be created or moved only by an organization admin (repository
# ruleset), so the workflow does not touch `v1`: after the release, an admin
# moves it with the command the release step prints. Immutable `v1.x.y`
# tags stay where they are for callers who pin.
#
# `bump` (manual): fetch the checksum of a tiden CLI release from the public
# tap, rewrite the two literals in sync.yml, and open a pull request. The
# default branch takes changes only through a pull request, so a bump lands
# only after a person has read the diff.
#
# GitHub refuses to let the workflow's own token push a change to a file
# under .github/workflows/ ("without `workflows` permission" — a scope the
# built-in token cannot be granted). When that refusal happens the job does
# not fail: it prints the two verified literals and the commands, and a
# maintainer opens the pull request from their machine. Nothing else is
# entitled to write here — this repository holds no personal token and no
# GitHub App key on purpose: what runs on customers' runners must not be
# changeable by a leaked secret.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tiden_version:
        description: tiden CLI release tag on qase-tms/homebrew-tap (for example v0.18.1)
        required: true
        type: string

permissions:
  contents: write   # gh release create; bump pushes its branch
  pull-requests: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the checksum and rewrite the literals
        env:
          V: ${{ inputs.tiden_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sums="$(curl -fsSL "https://github.com/qase-tms/homebrew-tap/releases/download/${V}/checksums.txt")"
          sha="$(printf '%s\n' "${sums}" | awk '$2 == "tiden_linux_amd64.tar.gz" { print $1 }')"
          [ -n "${sha}" ] || { echo "no checksum for tiden_linux_amd64.tar.gz in ${V}"; exit 1; }
          # The literal is verified against the archive itself, not only read from checksums.txt.
          curl -fsSL -o /tmp/tiden.tar.gz "https://github.com/qase-tms/homebrew-tap/releases/download/${V}/tiden_linux_amd64.tar.gz"
          echo "${sha}  /tmp/tiden.tar.gz" | sha256sum -c - >/dev/null
          sed -i -E "s|^(  TIDEN_VERSION: ).*|\1${V}|; s|^(  TIDEN_SHA256: ).*|\1${sha}|" .github/workflows/sync.yml
          git diff --quiet && { echo "already at ${V}"; exit 0; }
          git config user.name "tiden-actions bump"
          git config user.email "noreply@tiden.ai"
          git checkout -b "bump/${V}"
          git commit -am "Pin tiden ${V}"
          if git push -u origin "bump/${V}" 2>/tmp/push.err; then
            gh pr create --title "Pin tiden ${V}" --body "Checksum fetched from qase-tms/homebrew-tap release ${V} and verified against the archive. Review the two literals in sync.yml, then merge and tag."
          else
            cat /tmp/push.err
            echo "::warning::GitHub refused the push (the workflow token may not write .github/workflows/). Verified literals for ${V}:"
            echo "::warning::  TIDEN_VERSION: ${V}"
            echo "::warning::  TIDEN_SHA256: ${sha}"
            echo "::warning::A maintainer opens the pull request: git checkout -b bump/${V} && sed -i -E 's|^(  TIDEN_VERSION: ).*|\\1${V}|; s|^(  TIDEN_SHA256: ).*|\\1${sha}|' .github/workflows/sync.yml && git commit -am 'Pin tiden ${V}' && git push -u origin bump/${V} && gh pr create --fill"
          fi

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" --title "${tag}" --generate-notes
          major="v${tag#v}"; major="v${major%%.*}"
          echo "::notice::Release ${tag} published. An organization admin now moves the major tag:"
          echo "::notice::  git fetch --tags && git tag -f ${major} ${GITHUB_SHA} && git push -f origin refs/tags/${major}"
